function saveStars(n){ stars+=n; localStorage.setItem("ewa_stars",stars); document.getElementById("starCount").textContent = stars; }
function speak(text){
  /* 优先使用词典真人发音(女声,课本点读音质),失败时回退到系统语音 */
  const audio = new Audio("https://dict.youdao.com/dictvoice?audio=" + encodeURIComponent(text) + "&type=1");
  audio.play().catch(()=> speakLocal(text));
  audio.onerror = ()=> speakLocal(text);
}
function speakLocal(text){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB"; u.rate = .78; u.pitch = 1.1;
  const voices = speechSynthesis.getVoices();
  const prefer = ["Google UK English Female","Google US English","Samantha","Microsoft Aria","Microsoft Zira","Karen","Tessa","Victoria"];
  let v = null;
  for(const name of prefer){ v = voices.find(x=>x.name.includes(name)); if(v) break; }
  if(!v) v = voices.find(x=>x.lang.startsWith("en"));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function confetti(){
  const em = ["🎉","⭐","🌟","🎈","🍭"];
  for(let i=0;i<14;i++){
    const s = document.createElement("div");
    s.className="confetti"; s.textContent = em[Math.floor(Math.random()*em.length)];
    s.style.left = Math.random()*100+"vw";
    s.style.animationDelay = (Math.random()*.5)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),2300);
  }
}
function allWords(){ return UNITS.flatMap(u=>u.words.map(w=>({en:w[0],ipa:w[1],cn:w[2],em:w[3],unit:u.id}))); }
function unitWords(){
  if(curUnit==="ALL") return allWords();
  const u = UNITS.find(u=>u.id===curUnit);
  return u.words.map(w=>({en:w[0],ipa:w[1],cn:w[2],em:w[3],unit:u.id}));
}

/* ================= 界面切换 ================= */
function showTab(t){
  document.getElementById("panelPhon").classList.toggle("hidden", t!=="phon");
  document.getElementById("panelWord").classList.toggle("hidden", t!=="word");
  document.getElementById("tabPhon").className = "tab-btn" + (t==="phon"?" active-p":"");
  document.getElementById("tabWord").className = "tab-btn" + (t==="word"?" active-w":"");
}
function showPhon(kind){
  document.getElementById("phonQuiz").classList.add("hidden");
  document.getElementById("phonGrid").classList.remove("hidden");
  document.getElementById("subV").className = "sub-btn"+(kind==="vowel"?" on":"");
  document.getElementById("subC").className = "sub-btn"+(kind==="cons"?" on":"");
  document.getElementById("subQ").className = "sub-btn";
  const g = document.getElementById("phonGrid");
  g.innerHTML = PHONEMES[kind].map(p=>
    `<div class="p-card" onclick="speak('${p[2]}')">
       <div class="sym">/${p[0]}/</div>
       <div class="ex">${p[1]}<br>🔊 点我读</div>
     </div>`).join("");
}

/* ================= 音标闯关:听单词,找发音 ================= */
let pq = null;
function startPhonQuiz(){
  document.getElementById("phonGrid").classList.add("hidden");
  document.getElementById("subV").className = "sub-btn";
  document.getElementById("subC").className = "sub-btn";
  document.getElementById("subQ").className = "sub-btn on";
  const allPh = [...PHONEMES.vowel.map(p=>p[0]), ...PHONEMES.cons.map(p=>p[0])];
  const words = allWords();
  const qs = [];
  const phPool = shuffle(allPh.filter(ph => words.filter(w=>w.ipa.includes(ph)).length >= 1
      && words.filter(w=>!w.ipa.includes(ph)).length >= 3)).slice(0,10);
  phPool.forEach(ph=>{
    const ans = shuffle(words.filter(w=>w.ipa.includes(ph)))[0];
    const wrong = shuffle(words.filter(w=>!w.ipa.includes(ph))).slice(0,3);
    qs.push({ph, ans, opts:shuffle([ans,...wrong])});
  });
  pq = {qs, i:0, score:0};
  renderPhonQuiz();
}
function renderPhonQuiz(){
  const box = document.getElementById("phonQuiz");
  box.classList.remove("hidden");
  if(pq.i >= pq.qs.length){
    const s = pq.score>=8?3:pq.score>=5?2:1;
    saveStars(s);
    confetti();
    box.innerHTML = `<button class="back-btn" onclick="showPhon('vowel')">← 返回音标表</button>
      <div class="center"><div style="font-size:3rem">🏆</div>
      <h2>闯关完成!</h2><p style="margin:10px">答对 ${pq.score} / ${pq.qs.length} 题,获得 ${s} 颗⭐!</p>
      <button class="btn green" onclick="startPhonQuiz()">再玩一次</button></div>`;
    return;
  }
  const q = pq.qs[pq.i];
  box.innerHTML = `<button class="back-btn" onclick="showPhon('vowel')">← 返回音标表</button>
    <div class="prog"><div style="width:${pq.i/pq.qs.length*100}%"></div></div>
    <div class="center"><h2>第 ${pq.i+1} 题 / 共 ${pq.qs.length} 题</h2>
    <p style="font-size:1.3rem;margin:12px">哪个单词里含有 <b style="color:#e2543e;font-size:1.8rem">/${q.ph}/</b> 这个音?<br><small>先点 🔊 听一听,再做选择</small></p></div>
    <div class="opt-grid" id="pqOpts"></div><div class="msg" id="pqMsg"></div>`;
  const g = document.getElementById("pqOpts");
  q.opts.forEach(w=>{
    const d = document.createElement("div");
    d.className = "opt";
    d.innerHTML = `${w.en} <span style="font-size:1rem;color:#789">/${w.ipa}/</span>
      <button class="spk" style="width:40px;height:40px;font-size:.9rem" onclick="event.stopPropagation();speak('${w.en}')">🔊</button>`;
    d.onclick = ()=>{
      if(w === q.ans){
        d.classList.add("right"); pq.score++; saveStars(1);
        document.getElementById("pqMsg").textContent = "🎉 太棒了!答对啦!";
        speak(q.ans.en);
      } else {
        d.classList.add("wrong");
        document.getElementById("pqMsg").textContent = `再想想~ 正确答案是 ${q.ans.en}`;
      }
      [...g.children].forEach(c=>c.style.pointerEvents="none");
      setTimeout(()=>{ pq.i++; renderPhonQuiz(); }, 1600);
    };
    g.appendChild(d);
  });
}

/* ================= 单元选择 ================= */
function buildUnitRow(){
  const row = document.getElementById("unitRow");
  const btns = [{id:"ALL",name:"🌈 全部单元"}, ...UNITS.map(u=>({id:u.id,name:u.name}))];
  row.innerHTML = btns.map(u=>
    `<button class="unit-btn${curUnit===u.id?" on":""}" onclick="setUnit('${u.id}')">${u.name}</button>`).join("");
}
function setUnit(id){
  curUnit = id;
  buildUnitRow();
  document.getElementById("wordGame").classList.add("hidden");
  document.getElementById("modeGrid").classList.remove("hidden");
}
function backToModes(){
  document.getElementById("wordGame").classList.add("hidden");
  document.getElementById("modeGrid").classList.remove("hidden");
}
function openGame(){
  document.getElementById("modeGrid").classList.add("hidden");
  document.getElementById("wordGame").classList.remove("hidden");
}

/* ================= 游戏一:单词卡片 ================= */
let fc = null;
function startFlash(){
  openGame();
  fc = { words: shuffle(unitWords()), i:0 };
  renderFlash();
}
function renderFlash(){
  const box = document.getElementById("wordGame");
  if(fc.i >= fc.words.length){
    confetti(); saveStars(3);
    box.innerHTML = `<button class="back-btn" onclick="backToModes()">← 返回游戏列表</button>
      <div class="center"><div style="font-size:3rem">🎓</div><h2>本组单词都认识啦!</h2>
      <p style="margin:10px">共学习 ${fc.words.length} 个单词,奖励 3 颗⭐!</p>
      <button class="btn green" onclick="startFlash()">再来一组</button></div>`;
    return;
  }
  const w = fc.words[fc.i];
  box.innerHTML = `<button class="back-btn" onclick="backToModes()">← 返回游戏列表</button>
    <div class="prog"><div style="width:${fc.i/fc.words.length*100}%"></div></div>
    <p class="center" style="color:#789">${fc.i+1} / ${fc.words.length} · 点卡片翻面,跟读三遍哦</p>
    <div class="flash" id="flashCard" onclick="this.classList.toggle('flip');">
      <div class="flash-inner">
        <div class="face">
          <div class="em">${w.em}</div>
          <div class="big-word"><div class="w">${w.en}</div><div class="ipa">/${w.ipa}/</div></div>
          <p style="color:#9ab">👆 点我看意思</p>
        </div>
        <div class="face back">
          <div class="em">${w.em}</div>
          <div class="big-word"><div class="w">${w.en}</div><div class="ipa">/${w.ipa}/</div><div class="cn">${w.cn}</div></div>
        </div>
      </div>
    </div>
    <div class="center">
      <button class="spk" onclick="speak('${w.en}')">🔊</button><br>
      <button class="btn" onclick="speak(fc.words[fc.i].en); setTimeout(()=>{fc.i++;renderFlash();},500)">✅ 我记住了,下一个</button>
    </div>`;
}

/* ================= 游戏二:听音选词 ================= */
let lg = null;
function startListen(){
  openGame();
  const pool = unitWords();
  const qs = shuffle(pool).slice(0, Math.min(10, pool.length));
  lg = {qs, i:0, score:0};
  renderListen();
}
function renderListen(){
  const box = document.getElementById("wordGame");
  if(lg.i >= lg.qs.length){
    const s = lg.score>=8?3:lg.score>=5?2:1;
    confetti(); saveStars(s);
    box.innerHTML = `<button class="back-btn" onclick="backToModes()">← 返回游戏列表</button>
      <div class="center"><div style="font-size:3rem">🎧</div><h2>听力闯关完成!</h2>
      <p style="margin:10px">答对 ${lg.score} / ${lg.qs.length} 题,获得 ${s} 颗⭐!</p>
      <button class="btn green" onclick="startListen()">再玩一次</button></div>`;
    return;
  }
  const ans = lg.qs[lg.i];
  const pool = unitWords().filter(w=>w.en!==ans.en);
  const opts = shuffle([ans, ...shuffle(pool).slice(0,3)]);
  box.innerHTML = `<button class="back-btn" onclick="backToModes()">← 返回游戏列表</button>
    <div class="prog"><div style="width:${lg.i/lg.qs.length*100}%"></div></div>
    <div class="center"><h2>第 ${lg.i+1} 题 / 共 ${lg.qs.length} 题</h2>
      <p style="margin:8px;color:#789">仔细听,选出你听到的单词</p>
      <button class="spk" style="width:70px;height:70px;font-size:1.6rem" onclick="speak('${ans.en}')">🔊</button>
    </div>
    <div class="opt-grid" id="lgOpts"></div><div class="msg" id="lgMsg"></div>`;
  setTimeout(()=>speak(ans.en), 350);
  const g = document.getElementById("lgOpts");
  opts.forEach(w=>{
    const d = document.createElement("div");
    d.className = "opt";
    d.textContent = `${w.em} ${w.en}`;
    d.onclick = ()=>{
      if(w===ans){ d.classList.add("right"); lg.score++; saveStars(1);
        document.getElementById("lgMsg").textContent = `🎉 答对啦!${ans.en} ${ans.cn}`;
      } else { d.classList.add("wrong");
        document.getElementById("lgMsg").textContent = `正确答案是 ${ans.em} ${ans.en}(${ans.cn})`;
      }
      [...g.children].forEach(c=>c.style.pointerEvents="none");
      setTimeout(()=>{ lg.i++; renderListen(); }, 1700);
    };
    g.appendChild(d);
  });
}

/* ================= 游戏三:拼写小达人 ================= */
let sp = null;
function startSpell(){
  openGame();
  const pool = unitWords().filter(w=>w.en.length<=12 && !w.en.includes(" "));
  sp = { qs: shuffle(pool).slice(0, Math.min(8, pool.length)), i:0, score:0, cur:[] };
  renderSpell();
}
function renderSpell(){
  const box = document.getElementById("wordGame");
  if(sp.i >= sp.qs.length){
    const s = sp.score>=7?3:sp.score>=4?2:1;
    confetti(); saveStars(s);
    box.innerHTML = `<button class="back-btn" onclick="backToModes()">← 返回游戏列表</button>
      <div class="center"><div style="font-size:3rem">🧩</div><h2>拼写闯关完成!</h2>
      <p style="margin:10px">拼对 ${sp.score} / ${sp.qs.length} 个单词,获得 ${s} 颗⭐!</p>
      <button class="btn green" onclick="startSpell()">再玩一次</button></div>`;
    return;
  }
  const w = sp.qs[sp.i];
  sp.cur = [];
  const letters = shuffle(w.en.split("").map((c,idx)=>({c,idx})));
  box.innerHTML = `<button class="back-btn" onclick="backToModes()">← 返回游戏列表</button>
    <div class="prog"><div style="width:${sp.i/sp.qs.length*100}%"></div></div>
    <div class="center"><h2>第 ${sp.i+1} 题 / 共 ${sp.qs.length} 题</h2>
      <p style="font-size:1.5rem;margin:8px">${w.em} <b style="color:#3c7a5d">${w.cn}</b></p>
      <button class="spk" onclick="speak('${w.en}')">🔊</button>
    </div>
    <div class="slots" id="slots"></div>
    <div class="letters" id="letters"></div>
    <div class="msg" id="spMsg"></div>`;
  const sl = document.getElementById("slots");
  const lt = document.getElementById("letters");
  letters.forEach(L=>{
    const b = document.createElement("button");
    b.className = "ltr"; b.textContent = L.c;
    b.onclick = ()=>{
      b.classList.add("used");
      const s = document.createElement("div");
      s.className = "slot"; s.textContent = L.c;
      s.onclick = ()=>{ b.classList.remove("used"); s.remove(); sp.cur = sp.cur.filter(x=>x!==s); };
      sl.appendChild(s); sp.cur.push(s);
      if(sp.cur.length === w.en.length){
        const word = sp.cur.map(x=>x.textContent).join("");
        if(word === w.en){
          sp.score++; saveStars(1);
          document.getElementById("spMsg").textContent = `🎉 拼对啦!${w.en} /${w.ipa}/ ${w.cn}`;
          speak(w.en);
          lt.style.pointerEvents = "none";
          setTimeout(()=>{ sp.i++; renderSpell(); }, 1800);
        } else {
          document.getElementById("spMsg").textContent = "哎呀,顺序不对,再试一次!";
          setTimeout(()=>{ sl.innerHTML=""; sp.cur=[]; [...lt.children].forEach(x=>x.classList.remove("used")); }, 800);
        }
      }
    };
    lt.appendChild(b);
  });
}

/* ================= 游戏四:单词消消乐 ================= */
let mg = null;
function startMatch(){
  openGame();
  const pool = shuffle(unitWords()).slice(0, Math.min(6, unitWords().length));
  mg = { pairs: pool, sel:null, done:0 };
  const box = document.getElementById("wordGame");
  box.innerHTML = `<button class="back-btn" onclick="backToModes()">← 返回游戏列表</button>
    <p class="center" style="color:#789;margin-bottom:10px">点英文单词,再点它的中文意思,全部配对成功就赢啦!</p>
    <div class="match-grid">
      <div class="match-col" id="colEn"></div>
      <div class="match-col" id="colCn"></div>
    </div>
    <div class="msg" id="mgMsg"></div>`;
  const en = document.getElementById("colEn"), cn = document.getElementById("colCn");
  shuffle(pool).forEach(w=>{
    const d = document.createElement("div");
    d.className = "m-card"; d.textContent = `${w.em} ${w.en}`; d.dataset.k = w.en; d.dataset.side = "en";
    d.onclick = ()=>pickMatch(d, w);
    en.appendChild(d);
  });
  shuffle(pool).forEach(w=>{
    const d = document.createElement("div");
    d.className = "m-card"; d.textContent = w.cn; d.dataset.k = w.en; d.dataset.side = "cn";
    d.onclick = ()=>pickMatch(d, w);
    cn.appendChild(d);
  });
}
function pickMatch(el, w){
  if(el.classList.contains("done")) return;
  if(!mg.sel){
    mg.sel = el; el.classList.add("sel");
    if(el.dataset.side==="en") speak(w.en);
    return;
  }
  if(mg.sel === el){ el.classList.remove("sel"); mg.sel=null; return; }
  if(mg.sel.dataset.side === el.dataset.side){
    mg.sel.classList.remove("sel"); mg.sel = el; el.classList.add("sel"); return;
  }
  if(mg.sel.dataset.k === el.dataset.k){
    mg.sel.classList.remove("sel"); mg.sel.classList.add("done");
    el.classList.add("done"); mg.sel = null;
    mg.done++; saveStars(1); speak(w.en);
    document.getElementById("mgMsg").textContent = "🎉 配对成功!";
    if(mg.done === mg.pairs.length){
      confetti(); saveStars(3);
      document.getElementById("mgMsg").textContent = "🏆 全部配对成功!奖励 3 颗⭐!";
      const box = document.getElementById("wordGame");
      const b = document.createElement("div");
      b.className = "center";
      b.innerHTML = `<button class="btn green" onclick="startMatch()">再玩一次</button>`;
      box.appendChild(b);
    }
  } else {
    el.classList.add("bad"); mg.sel.classList.add("bad");
    const prev = mg.sel; mg.sel = null;
    document.getElementById("mgMsg").textContent = "再想想,它们不是好朋友哦~";
    setTimeout(()=>{ el.classList.remove("bad"); prev.classList.remove("bad","sel"); }, 500);
  }
}

showPhon("vowel");
speechSynthesis.getVoices();
</script>
